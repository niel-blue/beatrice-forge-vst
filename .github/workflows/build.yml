name: build (manual only)

on:
  # Automatic builds are paused until the authorized beatrice.lib supply
  # method for the public repository has been decided.
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      beatrice_dev_version: ${{ steps.values.outputs.beatrice_dev_version }}

    steps:
      - id: values
        shell: bash
        run: |
          [[ "${GITHUB_REF}" == refs/tags/v* ]] && echo "beatrice_dev_version=OFF" >> "${GITHUB_OUTPUT}" || echo "beatrice_dev_version=ON" >> "${GITHUB_OUTPUT}"

  build-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        run: >
          mingw32-make.exe distribution
          "BEATRICE_DEV_VERSION=${{ needs.prepare.outputs.beatrice_dev_version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/vs3/dist/beatrice_*_win.zip
          archive: false

  build-macos:
    needs: prepare
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        run: >
          make distribution
          "BEATRICE_DEV_VERSION=${{ needs.prepare.outputs.beatrice_dev_version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/vs3/dist/beatrice_*_mac.zip
          archive: false
